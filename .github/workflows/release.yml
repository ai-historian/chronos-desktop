name: release

# Release flow for the Chronos desktop app:
#   push tag v<version> (must equal package.json "version", e.g. v0.3.0)
#   -> the `release` job creates ONE draft GitHub release for that tag
#   -> each `installers` leg builds its OS/arch and uploads into that draft
#      (electron-builder publish: tagNamePrefix "v", releaseType draft)
#   -> publish the draft manually once all artefacts are attached.
# A workflow_dispatch run (no tag) builds every installer with --publish never and
# uploads them as workflow artifacts (Actions tab -> the run -> Artifacts), so test
# builds for every OS can be downloaded without tagging a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Build only this platform (manual runs)"
        type: choice
        default: all
        options: [all, linux, windows, mac-arm64, mac-x64]

permissions:
  contents: write

jobs:
  release:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.ref_type == 'tag'

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version (expected $expected). Bump the version or re-tag."
            exit 1
          fi

      # Created once here so the parallel installer legs don't race to create duplicate drafts.
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" --draft --title "Chronos $GITHUB_REF_NAME" --notes "Standalone app build"

  installers:
    name: Installers (${{ matrix.os }} ${{ matrix.args }})
    needs: release
    strategy:
      fail-fast: false
      # vendor/ carries the sharp/@img native prebuilds of the runner that ran bundle-agent,
      # so every installer is built on a runner of its own OS *and* arch: no universal or
      # cross-arch mac builds (macos-latest is arm64; macos-15-intel is x64). The x64 macOS
      # leg depends on GitHub still offering an Intel runner label — update it when that
      # label is retired.
      matrix:
        include:
          - { key: linux, os: ubuntu-latest, args: "--linux" }
          - { key: windows, os: windows-latest, args: "--win" }
          - { key: mac-arm64, os: macos-latest, args: "--mac --arm64" }
          - { key: mac-x64, os: macos-15-intel, args: "--mac --x64" }
    runs-on: ${{ matrix.os }}
    # Tag runs always build every platform; a manual run can pick one leg.
    if: github.ref_type == 'tag' || inputs.only == '' || inputs.only == 'all' || inputs.only == matrix.key
    env:
      # Pin the download caches to one path on every OS so actions/cache can restore them.
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        run: npm ci

      # Populates vendor/ (pi runtime + the agent/ pi-package with this OS's sharp prebuilds).
      - name: Bundle agent
        run: npm run bundle-agent

      - name: Build
        run: npm run build

      # Tag runs upload into the draft release; workflow_dispatch runs only build.
      - name: Package (and publish on tags)
        run: npx electron-builder ${{ matrix.args }} --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Manual runs: keep the installers as downloadable artifacts (90-day retention).
      - name: Upload installers as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: chronos-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
